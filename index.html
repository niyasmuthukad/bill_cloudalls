<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h1>Billing System</h1>
            <p>Please sign in to continue.</p>
            <div class="form-group">
                <input type="text" id="login-username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="password" id="login-password" placeholder="Password" required>
            </div>
            <button id="login-button">Login</button>
            <p id="login-error" style="color: red; display: none;"></p>
        </div>
    </div>

    <div id="app-screen" style="display: none;">
        <header>
            <h1>CloudAlls Billing</h1>
            <div id="user-info">
                <span id="user-email"></span>
                <button id="logout-button">Sign Out</button>
            </div>
        </header>

        <main>
            <div class="bill-details">
                <div class="form-group">
                    <label for="invoice-id">Invoice Number</label>
                    <input type="text" id="invoice-id" readonly>
                </div>
                <div class="form-group">
                    <label for="invoice-date">Date</label>
                    <input type="text" id="invoice-date">
                </div>
                <div class="form-group">
                    <label for="client-name">Bill To (Client Name)</label>
                    <input type="text" id="client-name" placeholder="Enter client name">
                </div>
            </div>

            <table id="line-items-table">
                <thead>
                    <tr>
                        <th>Description</th>
                        <th>Qty</th>
                        <th>Unit Price</th>
                        <th>Total</th>
                        <th>Remove</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
            
            <button id="add-item-button">+ Add Item</button>
            <button id="add-new-product-button">+ Add New Product</button>

            <div class="totals-section">
                <div class="form-group">
                    <label for="total">Total</label>
                    <input type="text" id="total" readonly>
                </div>
                <div class="form-group">
                    <label for="advance">Advance</label>
                    <input type="number" id="advance" value="0">
                </div>
                <div class="form-group">
                    <label for="subtotal">Subtotal</label>
                    <input type="text" id="subtotal" readonly>
                </div>
            </div>

            <button id="save-bill-button">Save Bill & New</button>
        </main>
    </div>

    <div id="loading-spinner" style="display: none;">
        <div class="spinner"></div>
    </div>

    <div id="new-product-modal" style="display: none;">
        <div class="modal-content">
            <span id="close-modal-button">&times;</span>
            <h2>Add New Product</h2>
            <div class="form-group">
                <label for="new-product-desc">Description</label>
                <input type="text" id="new-product-desc">
            </div>
            <div class="form-group">
                <label for="new-product-price">Unit Price</label>
                <input type="number" id="new-product-price">
            </div>
            <button id="save-new-product-button">Save Product</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
